name: probe
on:
  pull_request:
  merge_group:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: placeholder check
        run: |
          echo "event=${GITHUB_EVENT_NAME} ref=${GITHUB_REF}"
          sleep 20
          if [ -e fail.txt ]; then echo "fail.txt present: red on purpose"; exit 1; fi
          echo "green"
